name: QuotientGuard binding

on:
  pull_request:
    paths:
      - "crates/quotient-guard-binding/**"
      - ".github/workflows/quotient-guard-binding.yml"
  push:
    branches: [main]
    paths:
      - "crates/quotient-guard-binding/**"
      - ".github/workflows/quotient-guard-binding.yml"

permissions:
  contents: read

jobs:
  binding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
      - run: cargo fmt --manifest-path crates/quotient-guard-binding/Cargo.toml --check
      - run: cargo clippy --manifest-path crates/quotient-guard-binding/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path crates/quotient-guard-binding/Cargo.toml
