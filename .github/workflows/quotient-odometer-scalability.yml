name: K10 QuotientOdometer Scalability

on:
  push:
    paths:
      - "crates/quotient-odometer-scalability/**"
      - ".github/workflows/quotient-odometer-scalability.yml"
  pull_request:
    paths:
      - "crates/quotient-odometer-scalability/**"
      - ".github/workflows/quotient-odometer-scalability.yml"

jobs:
  scalability-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path crates/quotient-odometer-scalability/Cargo.toml --check
      - run: cargo clippy --manifest-path crates/quotient-odometer-scalability/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path crates/quotient-odometer-scalability/Cargo.toml --release
