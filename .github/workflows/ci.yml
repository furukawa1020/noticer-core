name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_solver:
        description: "optional solver jobを実行する"
        required: false
        default: false
        type: boolean

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QUOTIENT_FORGE_SOLVER: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: rustup target add wasm32-unknown-unknown
      - run: rustup show
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo run --locked -p quotient-forge-cli --bin quotient-forge -- check --output artifacts/ci-quotient-forge-check --seed 0 --solver off
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m pytest -q

  studio:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - run: rustup target add wasm32-unknown-unknown
        working-directory: .
      - run: npm ci
      - run: npm run check
      - run: npm run build

  solver-optional:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_solver }}
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: sudo apt-get update && sudo apt-get install -y z3
      - run: cargo run --locked -p quotient-forge-cli --bin quotient-forge -- synthesize --output artifacts/ci-quotient-forge-solver --seed 0 --solver required
