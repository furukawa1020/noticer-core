name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_solver:
        description: "optional solver jobを実行する"
        required: false
        default: false
        type: boolean

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QUOTIENT_FORGE_SOLVER: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: rustup target add wasm32-unknown-unknown
      - run: rustup show
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo run --locked -p quotient-forge-cli --bin quotient-forge -- check --output artifacts/ci-quotient-forge-check --seed 0 --solver off
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m pytest -q

  studio:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - run: rustup target add wasm32-unknown-unknown
        working-directory: .
      - run: npm ci
      - run: npm run check
      - run: npm run build

  solver-optional:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_solver }}
    name: solver-optional / ${{ matrix.solver }} / ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - solver: cvc5
            platform: linux-x86_64
            os: ubuntu-latest
            expected_available: "false"
          - solver: cvc5
            platform: windows-x86_64
            os: windows-latest
            expected_available: "false"
          - solver: z3
            platform: linux-x86_64
            os: ubuntu-latest
            expected_available: "true"
          - solver: z3
            platform: windows-x86_64
            os: windows-latest
            expected_available: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: rustup show
      - name: pinned solverを取得して検証する
        run: >-
          python scripts/install_pinned_solver.py
          --matrix configs/quotient_forge/solver_matrix_v1.json
          --solver ${{ matrix.solver }}
          --platform ${{ matrix.platform }}
          --destination .solver-cache
          --receipt artifacts/solver-${{ matrix.solver }}-${{ matrix.platform }}/install.json
      - name: capability probeとcanonical smokeを実行する
        run: >-
          cargo run --locked -p quotient-forge-solver --bin solver-ci --
          --matrix configs/quotient_forge/solver_matrix_v1.json
          --solver ${{ matrix.solver }}
          --platform ${{ matrix.platform }}
          --expect-available ${{ matrix.expected_available }}
          --install-root .solver-cache
          --output artifacts/solver-${{ matrix.solver }}-${{ matrix.platform }}
          --timeout-ms 5000
          --seed 0
      - name: solver別証跡を保存する
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: quotient-forge-${{ matrix.solver }}-${{ matrix.platform }}-${{ github.run_id }}
          path: artifacts/solver-${{ matrix.solver }}-${{ matrix.platform }}
          if-no-files-found: warn

  qbf-solver-optional:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_solver }}
    name: qbf-solver-optional / caqe / ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-latest
          - platform: windows-x86_64
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: rustup show
      - name: pinned CAQE sourceを検証してbuildする
        run: >-
          python scripts/install_pinned_qbf_solver.py
          --manifest configs/quotient_forge/qbf_solver_manifest_v1.json
          --platform ${{ matrix.platform }}
          --destination .qbf-solver-cache
          --receipt artifacts/qbf-caqe-${{ matrix.platform }}/install.json
      - name: bounded QBF SATとUNSAT smokeを実行する
        run: >-
          cargo run --locked -p quotient-forge-solver --bin qbf-solver-ci --
          --manifest configs/quotient_forge/qbf_solver_manifest_v1.json
          --platform ${{ matrix.platform }}
          --install-root .qbf-solver-cache
          --receipt artifacts/qbf-caqe-${{ matrix.platform }}/install.json
          --output artifacts/qbf-caqe-${{ matrix.platform }}
          --timeout-ms 5000
          --seed 0
      - name: QBF solver provenanceを保存する
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: quotient-forge-qbf-caqe-${{ matrix.platform }}-${{ github.run_id }}
          path: artifacts/qbf-caqe-${{ matrix.platform }}
          if-no-files-found: warn
