name: K9 QuotientLimit Noticer Adapters

on:
  push:
    paths:
      - "crates/quotient-limit-rational/**"
      - "crates/quotient-limit-noticer/**"
      - ".github/workflows/k9-quotient-limit-noticer.yml"
  pull_request:
    paths:
      - "crates/quotient-limit-rational/**"
      - "crates/quotient-limit-noticer/**"
      - ".github/workflows/k9-quotient-limit-noticer.yml"

jobs:
  public-adapter-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: rustfmt
      - name: Check formatting
        run: rustfmt --edition 2021 --check crates/quotient-limit-rational/src/lib.rs crates/quotient-limit-noticer/src/lib.rs
      - name: Build exact rational dependency
        run: |
          mkdir -p target/k9-quotient-limit
          rustc --edition 2021 --crate-name quotient_limit_rational --crate-type lib crates/quotient-limit-rational/src/lib.rs -o target/k9-quotient-limit/libquotient_limit_rational.rlib
      - name: Test public adapters
        run: |
          rustc --edition 2021 --test crates/quotient-limit-noticer/src/lib.rs --extern quotient_limit_rational=target/k9-quotient-limit/libquotient_limit_rational.rlib -o target/k9-quotient-limit/quotient-limit-noticer-tests
          target/k9-quotient-limit/quotient-limit-noticer-tests
      - name: Build no_std adapter library
        run: rustc --edition 2021 --crate-name quotient_limit_noticer --crate-type lib crates/quotient-limit-noticer/src/lib.rs --extern quotient_limit_rational=target/k9-quotient-limit/libquotient_limit_rational.rlib -o target/k9-quotient-limit/libquotient_limit_noticer.rlib
