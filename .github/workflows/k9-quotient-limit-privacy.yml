name: K9 QuotientLimit Privacy

on:
  push:
    paths:
      - "crates/quotient-limit-rational/**"
      - "crates/quotient-limit-privacy/**"
      - ".github/workflows/k9-quotient-limit-privacy.yml"
  pull_request:
    paths:
      - "crates/quotient-limit-rational/**"
      - "crates/quotient-limit-privacy/**"
      - ".github/workflows/k9-quotient-limit-privacy.yml"

jobs:
  exact-privacy-algebra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: rustfmt
      - name: Check formatting
        run: rustfmt --edition 2021 --check crates/quotient-limit-rational/src/lib.rs crates/quotient-limit-privacy/src/lib.rs
      - name: Build exact rational dependency
        run: |
          mkdir -p target/k9-quotient-limit
          rustc --edition 2021 --crate-name quotient_limit_rational --crate-type lib crates/quotient-limit-rational/src/lib.rs -o target/k9-quotient-limit/libquotient_limit_rational.rlib
      - name: Test privacy algebra
        run: |
          rustc --edition 2021 --test crates/quotient-limit-privacy/src/lib.rs --extern quotient_limit_rational=target/k9-quotient-limit/libquotient_limit_rational.rlib -o target/k9-quotient-limit/quotient-limit-privacy-tests
          target/k9-quotient-limit/quotient-limit-privacy-tests
      - name: Build privacy algebra
        run: rustc --edition 2021 --crate-name quotient_limit_privacy --crate-type lib crates/quotient-limit-privacy/src/lib.rs --extern quotient_limit_rational=target/k9-quotient-limit/libquotient_limit_rational.rlib -o target/k9-quotient-limit/libquotient_limit_privacy.rlib
