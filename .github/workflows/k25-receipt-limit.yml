name: K25 Receipt Limit

on:
  push:
    branches: [main]
    paths:
      - "src/noticer_core/receipt_limit_*.py"
      - "tests/test_receipt_limit_*.py"
      - "tools/*receipt_limit*.py"
      - "studio/src/scripts/receipt-limit-demo.mjs"
      - ".github/workflows/k25-receipt-limit.yml"
  pull_request:
    paths:
      - "src/noticer_core/receipt_limit_*.py"
      - "tests/test_receipt_limit_*.py"
      - "tools/*receipt_limit*.py"
      - "studio/src/scripts/receipt-limit-demo.mjs"
      - ".github/workflows/k25-receipt-limit.yml"

permissions:
  contents: read

concurrency:
  group: k25-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_receipt_limit_*.py
      - name: Compare regenerated reports and independently checked certificates
        run: |
          for output in "$RUNNER_TEMP/first" "$RUNNER_TEMP/second"; do
            python tools/run_receipt_limit_study.py --grid --output "$output/report.json"
            python tools/write_receipt_limit_certificate.py "$output/proof.json"
            python tools/check_receipt_limit_certificate.py "$output/proof.json" \
              > "$output/recheck.json"
          done
          diff -r "$RUNNER_TEMP/first" "$RUNNER_TEMP/second"
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-receipt-tradeoff
          path: ${{ runner.temp }}/first/*.json
