name: quotient-filter

on:
  push:
    paths:
      - "crates/quotient-filter/**"
      - "crates/quotient-odometer/**"
      - "crates/quotient-accountant-core/**"
      - ".github/workflows/quotient-filter.yml"
  pull_request:
    paths:
      - "crates/quotient-filter/**"
      - "crates/quotient-odometer/**"
      - "crates/quotient-accountant-core/**"
      - ".github/workflows/quotient-filter.yml"

jobs:
  filter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
        with:
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path crates/quotient-filter/Cargo.toml --check
      - run: cargo clippy --manifest-path crates/quotient-filter/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path crates/quotient-filter/Cargo.toml
