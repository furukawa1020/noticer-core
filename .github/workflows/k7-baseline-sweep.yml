name: k7-baseline-sweep

on:
  push:
    paths:
      - "src/noticer_core/evaluation/baseline_parameter_sweep.py"
      - "tests/test_k7_baseline_parameter_sweep.py"
      - "configs/quotient_forge/k7_baseline_sweep_v1.yaml"
      - ".github/workflows/k7-baseline-sweep.yml"
  pull_request:
    paths:
      - "src/noticer_core/evaluation/baseline_parameter_sweep.py"
      - "tests/test_k7_baseline_parameter_sweep.py"
      - "configs/quotient_forge/k7_baseline_sweep_v1.yaml"
      - ".github/workflows/k7-baseline-sweep.yml"

jobs:
  fairness-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src/noticer_core/evaluation/baseline_parameter_sweep.py tests/test_k7_baseline_parameter_sweep.py
      - run: python -m pytest tests/test_k7_baseline_parameter_sweep.py
