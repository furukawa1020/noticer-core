name: quotient-privacy-semantics

on:
  push:
    paths:
      - "crates/quotient-privacy-semantics/**"
      - ".github/workflows/quotient-privacy-semantics.yml"
  pull_request:
    paths:
      - "crates/quotient-privacy-semantics/**"
      - ".github/workflows/quotient-privacy-semantics.yml"

jobs:
  semantics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path crates/quotient-privacy-semantics/Cargo.toml --check
      - run: cargo clippy --manifest-path crates/quotient-privacy-semantics/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path crates/quotient-privacy-semantics/Cargo.toml
