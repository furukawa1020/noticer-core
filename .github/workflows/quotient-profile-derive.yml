name: quotient-profile-derive

on:
  push:
    paths:
      - "crates/quotient-profile-derive/**"
      - ".github/workflows/quotient-profile-derive.yml"
  pull_request:
    paths:
      - "crates/quotient-profile-derive/**"
      - ".github/workflows/quotient-profile-derive.yml"

jobs:
  exact-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path crates/quotient-profile-derive/Cargo.toml --check
      - run: cargo clippy --manifest-path crates/quotient-profile-derive/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path crates/quotient-profile-derive/Cargo.toml
