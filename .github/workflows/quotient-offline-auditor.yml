name: quotient-offline-auditor

on:
  push:
    paths:
      - "crates/quotient-offline-auditor/**"
      - ".github/workflows/quotient-offline-auditor.yml"
  pull_request:
    paths:
      - "crates/quotient-offline-auditor/**"
      - ".github/workflows/quotient-offline-auditor.yml"

jobs:
  offline-auditor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
        with:
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path crates/quotient-offline-auditor/Cargo.toml --check
      - run: cargo clippy --manifest-path crates/quotient-offline-auditor/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path crates/quotient-offline-auditor/Cargo.toml
