name: Studio Pages

on:
  push:
    branches: [main]
    paths:
      - "studio/**"
      - "src/noticer_core/slot_mix_*.py"
      - "tools/*slot_mix_certificate.py"
      - ".github/workflows/studio-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - run: rustup target add wasm32-unknown-unknown
      - run: npm ci
        working-directory: studio
      - run: npm run check
        working-directory: studio
      - run: npm run build
        working-directory: studio
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Publish an independently checked synthetic certificate
        env:
          PYTHONPATH: src
        run: |
          proof=studio/dist/mixed-slot-proof/asymmetric.json
          python tools/write_slot_mix_certificate.py "$proof"
          python tools/check_slot_mix_certificate.py "$proof"
      - name: Check public routes and evidence labels
        run: |
          node --test scripts/check-public-routes.test.mjs
          node scripts/check-public-routes.mjs
        working-directory: studio
      - uses: actions/upload-pages-artifact@v3
        with:
          path: studio/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
