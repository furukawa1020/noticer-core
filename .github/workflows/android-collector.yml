name: Android collector

on:
  pull_request:
    paths:
      - "android/collector/**"
      - ".github/workflows/android-collector.yml"
  push:
    branches: [main]
    paths:
      - "android/collector/**"
      - ".github/workflows/android-collector.yml"

permissions:
  contents: read

jobs:
  collector:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Kotlin unit tests and debug APK
        working-directory: android/collector
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Rust bridge tests
        run: cargo test --manifest-path android/collector/native/Cargo.toml

