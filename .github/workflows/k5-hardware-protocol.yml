name: K5 hardware protocol

on:
  pull_request:
    paths:
      - "src/noticer_core/evaluation/hardware_evidence.py"
      - "schemas/k5_hardware_evidence_public.schema.json"
      - "configs/k5/hardware_protocol.yaml"
      - "tools/validate_k5_hardware_evidence.py"
      - "tests/test_k5_hardware_evidence.py"
      - "docs/k5_hardware_protocol.md"
      - ".github/workflows/k5-hardware-protocol.yml"
  push:
    branches: [main]
    paths:
      - "src/noticer_core/evaluation/hardware_evidence.py"
      - "schemas/k5_hardware_evidence_public.schema.json"
      - "configs/k5/hardware_protocol.yaml"
      - "tools/validate_k5_hardware_evidence.py"
      - "tests/test_k5_hardware_evidence.py"
      - "docs/k5_hardware_protocol.md"
      - ".github/workflows/k5-hardware-protocol.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-artifact-contract:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test tools
        run: python -m pip install -e . pytest ruff
      - name: Test bounded artifact contract
        run: python -m pytest tests/test_k5_hardware_evidence.py
      - name: Lint protocol implementation
        run: >-
          python -m ruff check
          src/noticer_core/evaluation/hardware_evidence.py
          tools/validate_k5_hardware_evidence.py
          tests/test_k5_hardware_evidence.py
      - name: Exercise NOT_VERIFIED artifacts only
        shell: bash
        run: |
          for tier in B C D S3; do
            output="artifacts/k5-hardware/tier-${tier}.json"
            python tools/validate_k5_hardware_evidence.py init \
              --tier "${tier}" --output "${output}" --public-run-id "ci-${tier}"
            python tools/validate_k5_hardware_evidence.py validate --input "${output}"
            grep -q '"status": "NOT_VERIFIED"' "${output}"
          done
      - name: Reject generated artifact tracking
        shell: bash
        run: test -z "$(git status --porcelain --untracked-files=all)"
