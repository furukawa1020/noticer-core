name: K9 QuotientLimit Fault and Collusion

on:
  push:
    paths:
      - "crates/quotient-limit-rational/**"
      - "crates/quotient-limit-fault/**"
      - ".github/workflows/k9-quotient-limit-fault.yml"
  pull_request:
    paths:
      - "crates/quotient-limit-rational/**"
      - "crates/quotient-limit-fault/**"
      - ".github/workflows/k9-quotient-limit-fault.yml"

jobs:
  robust-fault-collusion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: rustfmt
      - name: Check formatting
        run: rustfmt --edition 2021 --check crates/quotient-limit-rational/src/lib.rs crates/quotient-limit-fault/src/lib.rs
      - name: Build exact rational dependency
        run: |
          mkdir -p target/k9-quotient-limit
          rustc --edition 2021 --crate-name quotient_limit_rational --crate-type lib crates/quotient-limit-rational/src/lib.rs -o target/k9-quotient-limit/libquotient_limit_rational.rlib
      - name: Test robust fault and collusion algebra
        run: |
          rustc --edition 2021 --test crates/quotient-limit-fault/src/lib.rs --extern quotient_limit_rational=target/k9-quotient-limit/libquotient_limit_rational.rlib -o target/k9-quotient-limit/quotient-limit-fault-tests
          target/k9-quotient-limit/quotient-limit-fault-tests
      - name: Build no_std library
        run: rustc --edition 2021 --crate-name quotient_limit_fault --crate-type lib crates/quotient-limit-fault/src/lib.rs --extern quotient_limit_rational=target/k9-quotient-limit/libquotient_limit_rational.rlib -o target/k9-quotient-limit/libquotient_limit_fault.rlib
