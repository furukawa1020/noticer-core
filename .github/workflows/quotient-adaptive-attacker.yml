name: quotient-adaptive-attacker

on:
  push:
    paths:
      - "crates/quotient-adaptive-attacker/**"
      - ".github/workflows/quotient-adaptive-attacker.yml"
  pull_request:
    paths:
      - "crates/quotient-adaptive-attacker/**"
      - ".github/workflows/quotient-adaptive-attacker.yml"

jobs:
  adaptive-attacker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
        with:
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path crates/quotient-adaptive-attacker/Cargo.toml --check
      - run: cargo clippy --manifest-path crates/quotient-adaptive-attacker/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path crates/quotient-adaptive-attacker/Cargo.toml
