name: K9 QuotientLimit checker

on:
  push:
    paths:
      - "crates/quotient-limit-rational/**"
      - "crates/quotient-limit-check/**"
      - ".github/workflows/k9-quotient-limit.yml"
  pull_request:
    paths:
      - "crates/quotient-limit-rational/**"
      - "crates/quotient-limit-check/**"
      - ".github/workflows/k9-quotient-limit.yml"

permissions:
  contents: read

jobs:
  exact-primal-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: rustfmt --edition 2021 --check crates/quotient-limit-rational/src/lib.rs crates/quotient-limit-check/src/lib.rs
      - name: Build and test no_std rational core
        run: |
          mkdir -p target/k9-quotient-limit
          rustc --edition 2021 --test crates/quotient-limit-rational/src/lib.rs -o target/k9-quotient-limit/rational-tests
          target/k9-quotient-limit/rational-tests
          rustc --edition 2021 --crate-name quotient_limit_rational --crate-type lib crates/quotient-limit-rational/src/lib.rs -o target/k9-quotient-limit/libquotient_limit_rational.rlib
      - name: Build and test independent primal checker
        run: |
          rustc --edition 2021 --test crates/quotient-limit-check/src/lib.rs --extern quotient_limit_rational=target/k9-quotient-limit/libquotient_limit_rational.rlib -o target/k9-quotient-limit/check-tests
          target/k9-quotient-limit/check-tests
          rustc --edition 2021 --crate-type lib crates/quotient-limit-check/src/lib.rs --extern quotient_limit_rational=target/k9-quotient-limit/libquotient_limit_rational.rlib -o target/k9-quotient-limit/libquotient_limit_check.rlib
