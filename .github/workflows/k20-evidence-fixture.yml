name: K20 Evidence Fixture

on:
  push:
    branches: [main]
    paths:
      - "src/noticer_core/evaluation/k20_*.py"
      - "tests/test_k20_fixture_report.py"
      - ".github/workflows/k20-evidence-fixture.yml"
  pull_request:
    paths:
      - "src/noticer_core/evaluation/k20_*.py"
      - "tests/test_k20_fixture_report.py"
      - ".github/workflows/k20-evidence-fixture.yml"

permissions:
  contents: read

jobs:
  deterministic-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_k20_fixture_report.py
      - name: Compare synthetic artifacts byte for byte
        run: |
          python -m noticer_core.evaluation.k20_fixture_report "$RUNNER_TEMP/first"
          python -m noticer_core.evaluation.k20_fixture_report "$RUNNER_TEMP/second"
          diff -r "$RUNNER_TEMP/first" "$RUNNER_TEMP/second"
