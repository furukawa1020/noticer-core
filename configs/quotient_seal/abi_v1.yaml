schema_version: quotient-seal-abi-contract-v1
contract_id: quotient-seal-capability-separated-wasm-abi
contract_version: 1
status: FROZEN
parent_semantics: configs/quotient_seal/k8_semantics.yaml

canonical_hash:
  algorithm: SHA-256
  domain: quotient-seal-abi-v1
  descriptor_symbol: QUOTIENT_SEAL_ABI_V1_DESCRIPTOR
  hash_function: quotient_seal_abi_v1_hash

capabilities:
  private_only:
    - qseal.private.ingest
  public:
    - qseal.public.tick
    - qseal.public.reset
    - qseal.public.handoff
    - qseal.public.status
  private_export_policy: FORBIDDEN
  private_import_policy: FORBIDDEN
  private_wire_policy: UNREPRESENTABLE

host_imports:
  - name: qseal.emit_frame
    signature: "(i32,i64)->i32"
  - name: qseal.emit_action
    signature: "(i32,i32)->i32"
  - name: qseal.public_failure
    signature: "(i32)->i32"

public_exports:
  - name: qseal.public.tick
    signature: "(i32,i64,i32)->i32"
  - name: qseal.public.reset
    signature: "()->i32"
  - name: qseal.public.handoff
    signature: "()->i64"
  - name: qseal.public.status
    signature: "()->i32"

public_wire:
  magic: QSAB
  version: 1
  bytes: 24
  byte_order: LITTLE_ENDIAN
  service_alias: NONZERO_U32
  public_slot: U64
  faults:
    - NONE
    - TIMEOUT
    - RECONNECT
    - LOSS
  malformed_length: REJECT
  unknown_method: REJECT
  unknown_fault: REJECT
  noncanonical_reserved: REJECT

profiles:
  - P0_PUBLIC_QUOTIENT_ONLY
  - P1_SEALED_ADMISSION

verdicts:
  - VALID
  - INVALID
  - INCOMPATIBLE
  - RESOURCE_BOUND
