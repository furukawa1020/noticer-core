[workspace]
resolver = "2"
members = [
  "crates/noticer-types",
  "crates/noticer-protocol",
  "crates/noticer-crypto",
  "crates/noticer-baseline",
  "crates/noticer-evidence",
  "crates/noticer-evidence-demo",
  "crates/noticer-claim",
  "crates/noticer-release",
  "crates/noticer-aetp",
  "crates/noticer-trace-shaper",
  "crates/noticer-aetp-sim",
  "crates/noticer-aetp-demo",
  "crates/noticer-token",
  "crates/noticer-verifier-core",
  "crates/noticer-verifier",
  "crates/noticer-token-demo",
  "crates/noticer-transport-core",
  "crates/noticer-transport-sim",
  "crates/noticer-menfugu-core",
  "crates/noticer-menfugu-firmware",
  "crates/noticer-ble-host",
  "crates/noticer-k4-demo",
    "crates/noticer-provenance",
    "crates/noticer-acquisition-core",
    "crates/noticer-ppg-features",
    "crates/noticer-evidence-bridge",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
noticer-types = { path = "crates/noticer-types" }
noticer-protocol = { path = "crates/noticer-protocol" }
noticer-crypto = { path = "crates/noticer-crypto" }
noticer-baseline = { path = "crates/noticer-baseline" }
noticer-evidence = { path = "crates/noticer-evidence" }
noticer-claim = { path = "crates/noticer-claim" }
noticer-release = { path = "crates/noticer-release" }
noticer-aetp = { path = "crates/noticer-aetp" }
noticer-trace-shaper = { path = "crates/noticer-trace-shaper" }
noticer-aetp-sim = { path = "crates/noticer-aetp-sim" }
noticer-token = { path = "crates/noticer-token" }
noticer-verifier = { path = "crates/noticer-verifier" }
noticer-provenance = { path = "crates/noticer-provenance" }
noticer-acquisition-core = { path = "crates/noticer-acquisition-core" }
noticer-ppg-features = { path = "crates/noticer-ppg-features" }
noticer-evidence-bridge = { path = "crates/noticer-evidence-bridge" }
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "2.2", features = ["rand_core", "zeroize"] }
hkdf = "0.12"
hmac = "0.12"
zeroize = { version = "1", features = ["derive"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
proptest = "1"
trybuild = "1"
clap = { version = "4", features = ["derive"] }
csv = "1"
